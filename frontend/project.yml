name: Kaleido
options:
  bundleIdPrefix: com.adventurex
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: JRHT3J6CWU
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  Kaleido:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Possibility
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        NSMicrophoneUsageDescription: 录制语音日记需要使用麦克风。
        NSSpeechRecognitionUsageDescription: 将语音日记转写为文字需要使用语音识别。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnnywang.kaleido
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  KaleidoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KaleidoUITests
    dependencies:
      - target: Kaleido
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnnywang.kaleido.uitests
        TEST_TARGET_NAME: Kaleido
schemes:
  Kaleido:
    build:
      targets:
        Kaleido: all
        KaleidoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KaleidoUITests
