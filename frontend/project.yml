name: Kaleido
options:
  bundleIdPrefix: com.adventurex
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  Kaleido:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 万花筒
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adventurex.kaleido
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
  KaleidoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KaleidoUITests
    dependencies:
      - target: Kaleido
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adventurex.kaleido.uitests
        TEST_TARGET_NAME: Kaleido
schemes:
  Kaleido:
    build:
      targets:
        Kaleido: all
        KaleidoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KaleidoUITests
