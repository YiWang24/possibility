name: Possibility
options:
  bundleIdPrefix: com.adventurex
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: JRHT3J6CWU
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  Possibility:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: Possibility.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Possibility
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        NSMicrophoneUsageDescription: 录制语音日记需要使用麦克风。
        NSSpeechRecognitionUsageDescription: 将语音日记转写为文字需要使用语音识别。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnnywang.possibility
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PossibilityUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PossibilityUITests
    dependencies:
      - target: Possibility
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnnywang.possibility.uitests
        TEST_TARGET_NAME: Possibility
        GENERATE_INFOPLIST_FILE: YES
  PossibilityTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PossibilityTests
    dependencies:
      - target: Possibility
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adventurex.possibility.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Possibility:
    build:
      targets:
        Possibility: all
        PossibilityUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PossibilityTests
        - PossibilityUITests
