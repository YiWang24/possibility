<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我有可能 · 人生决策扑克牌</title>
<style>
  :root{
    --ink:#1c3f94;      /* 描边蓝 */
    --red:#d21f2b;      /* 红 */
    --gold:#f3c518;     /* 金 */
    --black:#16181d;    /* 黑 */
    --cream:#fdfbf3;    /* 牌面米白 */
    --skin:#f7e4cf;     /* 肤色 */
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    background:#0e1116;
    color:#e8e8ea;
    -webkit-font-smoothing:antialiased;
  }
  header{
    text-align:center;
    padding:40px 20px 10px;
  }
  header h1{margin:0;font-size:26px;letter-spacing:2px}
  header p{margin:8px 0 0;color:#9aa0aa;font-size:14px}
  .deck{
    display:flex;
    flex-wrap:wrap;
    gap:28px;
    justify-content:center;
    padding:30px 24px 60px;
    max-width:1200px;
    margin:0 auto;
  }
  .card-wrap{width:280px}
  .card-wrap svg{
    width:100%;height:auto;display:block;
    border-radius:16px;
    box-shadow:0 18px 40px rgba(0,0,0,.5);
  }
  .card-wrap .cap{
    text-align:center;margin-top:12px;font-size:13px;color:#b9bfca;line-height:1.5;
  }
  .card-wrap .cap b{color:#fff}
  .toolbar{text-align:center;padding-bottom:40px}
  .toolbar button{
    background:#1c3f94;color:#fff;border:0;border-radius:8px;
    padding:10px 18px;font-size:14px;cursor:pointer;margin:0 6px;
  }
  @media print{
    body{background:#fff}
    header,.toolbar{display:none}
    .deck{gap:8px}
    .card-wrap{width:2.5in}
    .card-wrap svg{box-shadow:none;border:1px solid #ccc}
    .card-wrap .cap{display:none}
  }
</style>
</head>
<body>
<header>
  <h1>我有可能 · 人生决策扑克牌</h1>
  <p>每个人都是自己人生的 King —— 站在岔路口，牌握在你手里</p>
</header>

<div class="deck" id="deck"></div>

<div class="toolbar">
  <button onclick="window.print()">打印 / 导出 PDF</button>
</div>

<script>
const C = {
  ink:"#1c3f94", red:"#d21f2b", gold:"#f3c518",
  black:"#16181d", cream:"#fdfbf3", skin:"#f7e4cf"
};

/* ---------- 花色路径（居中于 0,0，尺寸约 40） ---------- */
function suitPath(kind){
  switch(kind){
    case "spade": return "M0,-22 C14,-6 24,2 24,12 C24,22 14,24 6,18 C8,24 10,26 14,28 L-14,28 C-10,26 -8,24 -6,18 C-14,24 -24,22 -24,12 C-24,2 -14,-6 0,-22 Z";
    case "heart": return "M0,26 C-4,20 -24,8 -24,-8 C-24,-20 -12,-24 -4,-16 C-2,-13 0,-9 0,-9 C0,-9 2,-13 4,-16 C12,-24 24,-20 24,-8 C24,8 4,20 0,26 Z";
    case "club":  return "M-4,28 C-4,20 -2,16 0,14 C-8,20 -20,16 -20,4 C-20,-6 -10,-10 -3,-6 C-8,-12 -8,-24 0,-24 C8,-24 8,-12 3,-6 C10,-10 20,-6 20,4 C20,16 8,20 0,14 C2,16 4,20 4,28 Z";
    case "diamond": return "M0,-26 L20,0 L0,26 L-20,0 Z";
  }
}
const suitColor = k => (k==="heart"||k==="diamond") ? C.red : C.black;

/* ---------- 道具（放在国王右手，居中于 0,0） ---------- */
function prop(kind){
  switch(kind){
    case "grad": // 学位帽 + 书卷
      return `
        <g>
          <rect x="-20" y="0" width="40" height="14" rx="2" fill="${C.black}"/>
          <polygon points="0,-14 34,-2 0,10 -34,-2" fill="${C.ink}" stroke="${C.black}" stroke-width="1.5"/>
          <circle cx="0" cy="-2" r="4" fill="${C.gold}"/>
          <path d="M24,-2 L30,16" stroke="${C.gold}" stroke-width="2.5"/>
          <circle cx="30" cy="18" r="4" fill="${C.red}"/>
        </g>`;
    case "rocket": // 火箭 / 创业
      return `
        <g>
          <path d="M0,-30 C12,-16 12,4 6,18 L-6,18 C-12,4 -12,-16 0,-30 Z" fill="${C.cream}" stroke="${C.ink}" stroke-width="2"/>
          <circle cx="0" cy="-6" r="6" fill="${C.ink}"/>
          <path d="M-6,14 L-16,26 L-6,22 Z" fill="${C.red}"/>
          <path d="M6,14 L16,26 L6,22 Z" fill="${C.red}"/>
          <path d="M-4,20 C-2,32 2,32 4,20 Z" fill="${C.gold}"/>
        </g>`;
    case "ring": // 双戒指 / 婚姻
      return `
        <g fill="none" stroke-width="6">
          <circle cx="-9" cy="4" r="14" stroke="${C.gold}"/>
          <circle cx="11" cy="4" r="14" stroke="${C.gold}"/>
          <path d="M-9,-16 l-5,8 h10 z" fill="${C.red}" stroke="none"/>
        </g>`;
    case "baby": // 拨浪鼓 / 家庭
      return `
        <g>
          <circle cx="0" cy="-6" r="14" fill="${C.cream}" stroke="${C.ink}" stroke-width="2"/>
          <path d="M-9,-12 a6 6 0 0 1 8,-2" stroke="${C.red}" stroke-width="2.5" fill="none"/>
          <circle cx="4" cy="-9" r="2.5" fill="${C.ink}"/>
          <rect x="-3" y="6" width="6" height="22" rx="3" fill="${C.gold}"/>
          <circle cx="-16" cy="-4" r="4" fill="${C.red}"/>
          <circle cx="16" cy="-4" r="4" fill="${C.ink}"/>
        </g>`;
  }
}

/* ---------- 国王半身（上半部，向上，可变姿势/道具） ---------- */
function king(cfg){
  const robeA = cfg.robeA, robeB = cfg.robeB;
  const tilt = cfg.tilt || 0;      // 头部/冠倾斜
  const armX = cfg.armX ?? 78;     // 持械手臂位置
  return `
  <g transform="translate(250,215)">
    <!-- 肩 / 袍 -->
    <path d="M-96,120 C-96,40 -52,10 0,10 C52,10 96,40 96,120 Z"
          fill="${robeA}" stroke="${C.black}" stroke-width="2"/>
    <path d="M-40,120 C-40,60 -20,34 0,34 C20,34 40,60 40,120 Z"
          fill="${robeB}" stroke="${C.black}" stroke-width="2"/>
    <!-- 袍上花色纹 -->
    <g transform="translate(0,84) scale(0.7)">
      <path d="${suitPath(cfg.suit)}" fill="${suitColor(cfg.suit)}"/>
    </g>
    <!-- 貂皮领 -->
    <path d="M-58,26 C-30,54 30,54 58,26 L48,52 C24,72 -24,72 -48,52 Z"
          fill="#ffffff" stroke="${C.black}" stroke-width="1.5"/>
    <g fill="${C.black}">
      <circle cx="-30" cy="48" r="2"/><circle cx="0" cy="55" r="2"/><circle cx="30" cy="48" r="2"/>
    </g>

    <!-- 持械手臂 -->
    <g transform="translate(${armX},70)">
      <path d="M-14,44 C-20,10 -6,-6 12,-10 L22,10 C10,16 4,28 8,46 Z"
            fill="${robeA}" stroke="${C.black}" stroke-width="2"/>
      <circle cx="16" cy="-4" r="9" fill="${C.skin}" stroke="${C.ink}" stroke-width="1.5"/>
      <g transform="translate(20,-30)">${prop(cfg.prop)}</g>
    </g>

    <!-- 头部（可倾斜） -->
    <g transform="rotate(${tilt})">
      <!-- 头发 -->
      <path d="M-34,-38 C-40,-6 -34,20 0,20 C34,20 40,-6 34,-38 C20,-30 -20,-30 -34,-38 Z"
            fill="${C.ink}"/>
      <!-- 脸 -->
      <ellipse cx="0" cy="-14" rx="30" ry="36" fill="${C.skin}" stroke="${C.ink}" stroke-width="1.5"/>
      <!-- 眼 -->
      <circle cx="-11" cy="-20" r="2.6" fill="${C.ink}"/>
      <circle cx="11" cy="-20" r="2.6" fill="${C.ink}"/>
      <!-- 鼻 -->
      <path d="M0,-20 L-3,-6 L2,-6" fill="none" stroke="${C.ink}" stroke-width="1.5"/>
      <!-- 胡须 -->
      <path d="M-16,-2 C-10,14 10,14 16,-2 C10,4 -10,4 -16,-2 Z" fill="${C.ink}"/>
      <path d="M-14,-8 C-10,-3 -4,-3 0,-6 C4,-3 10,-3 14,-8" fill="none" stroke="${C.ink}" stroke-width="1.6"/>

      <!-- 王冠 -->
      <g transform="translate(0,-46)">
        <path d="M-34,4 L-34,-14 L-18,-2 L0,-20 L18,-2 L34,-14 L34,4 Z"
              fill="${C.gold}" stroke="${C.black}" stroke-width="2"/>
        <rect x="-34" y="4" width="68" height="10" fill="${C.gold}" stroke="${C.black}" stroke-width="2"/>
        <circle cx="-34" cy="-14" r="4" fill="${C.red}"/>
        <circle cx="0" cy="-20" r="4" fill="${C.red}"/>
        <circle cx="34" cy="-14" r="4" fill="${C.red}"/>
        <circle cx="-14" cy="9" r="3" fill="${C.red}"/>
        <circle cx="14" cy="9" r="3" fill="${C.ink}"/>
      </g>
    </g>
  </g>`;
}

/* ---------- 组装单张卡 ---------- */
function card(cfg){
  const s = suitPath(cfg.suit);
  const col = suitColor(cfg.suit);
  const index = `
    <g fill="${col}" font-family="Georgia,serif" font-weight="700">
      <text x="0" y="0" font-size="46" text-anchor="middle">K</text>
      <g transform="translate(0,34) scale(0.42)"><path d="${s}" fill="${col}"/></g>
    </g>`;
  return `
  <svg viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="500" height="700" rx="24" fill="${C.cream}"/>
    <rect x="14" y="14" width="472" height="672" rx="16" fill="none" stroke="${C.ink}" stroke-width="4"/>
    <rect x="24" y="24" width="452" height="652" rx="12" fill="none" stroke="${C.ink}" stroke-width="1.5"/>

    <!-- 四角标识 -->
    <g transform="translate(56,66)">${index}</g>
    <g transform="translate(444,634) rotate(180)">${index}</g>

    <!-- 中央镜像人物 -->
    <g>
      ${king(cfg)}
      <g transform="rotate(180 250 350)">${king(cfg)}</g>
    </g>

    <!-- 中缝分割线 + 场景牌 -->
    <line x1="70" y1="350" x2="430" y2="350" stroke="${C.ink}" stroke-width="2"/>
    <g transform="translate(250,350)">
      <rect x="-140" y="-19" width="280" height="38" rx="19" fill="${C.ink}"/>
      <text x="0" y="-1" text-anchor="middle" fill="#fff" font-size="19" font-weight="700"
            font-family="'PingFang SC','Noto Sans SC',sans-serif">${cfg.title}</text>
      <text x="0" y="13" text-anchor="middle" fill="${C.gold}" font-size="9" letter-spacing="3"
            font-family="Georgia,serif">${cfg.en}</text>
    </g>

    <!-- 品牌 -->
    <text x="250" y="690" text-anchor="middle" fill="${C.ink}" font-size="9" letter-spacing="4"
          font-family="Georgia,serif" opacity="0.7">我有可能 · POSSIBILITY</text>
  </svg>`;
}

/* ---------- 四张牌配置 ---------- */
const cards = [
  { suit:"spade",   prop:"grad",   title:"35岁 · 辞职留学",  en:"QUIT & STUDY ABROAD",
    robeA:"#16181d", robeB:"#1c3f94", tilt:-6, armX:78,
    cap:"<b>♠ 黑桃 · 智识/挑战</b><br>推倒重来，把人生当第二次高考" },
  { suit:"diamond", prop:"rocket", title:"30岁 · 转行创业",  en:"CAREER PIVOT",
    robeA:"#d21f2b", robeB:"#f3c518", tilt:5, armX:-78,
    cap:"<b>♦ 方块 · 财富/事业</b><br>离开安稳区，赌一次自己的想法" },
  { suit:"heart",   prop:"ring",   title:"28岁 · 异地恋结婚", en:"MARRY ACROSS MILES",
    robeA:"#d21f2b", robeB:"#1c3f94", tilt:-4, armX:78,
    cap:"<b>♥ 红桃 · 情感/婚姻</b><br>把两座城市，收成一个家" },
  { suit:"club",    prop:"baby",   title:"33岁 · 要不要生小孩", en:"TO HAVE A CHILD",
    robeA:"#16181d", robeB:"#d21f2b", tilt:6, armX:-78,
    cap:"<b>♣ 梅花 · 家庭/成长</b><br>多一个人，多一种可能" },
];

const deck = document.getElementById("deck");
deck.innerHTML = cards.map(c => `
  <div class="card-wrap">
    ${card(c)}
    <div class="cap">${c.cap}</div>
  </div>`).join("");
</script>
</body>
</html>
