<!doctype html><html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .stage{width:1080px;height:1620px}
  .nmchip{position:absolute;z-index:4;transform:translate(-50%,-50%);background:var(--paper);border-radius:12px;
    padding:6px 14px;font-family:var(--round);font-weight:800;font-size:17px;box-shadow:0 5px 0 rgba(38,38,31,.1);white-space:nowrap}
  .nmchip small{font-weight:600;font-size:12px;color:var(--teal-d);display:block;margin-top:1px}
  .tblock{position:absolute;left:64px;top:900px;right:64px}
  .tblock h1{font-size:62px}
  .tblock p{font-size:19px;margin-top:14px}
  .cards{position:absolute;left:64px;right:64px;top:1236px}
  .resbar{position:absolute;left:64px;right:64px;top:1494px}
</style></head>
<body>
<div class="stage">
  <svg class="scene" id="scene" viewBox="0 0 1080 1620" width="1080" height="1620" preserveAspectRatio="xMidYMid slice"></svg>

  <div class="phead">
    <div class="bmini"><svg viewBox="-50 -50 100 100" id="bmk"></svg><div><div class="nm">我有可能</div><div class="tg">自我探索 · 人生决策</div></div></div>
    <div class="ftag">功能 03<small>KALEIDOSCOPE</small></div>
  </div>

  <div class="nmchip" style="left:180px;top:556px">晴川寻路<small>设计转独立开发</small></div>
  <div class="nmchip" style="left:905px;top:556px">木槿慢跑<small>前运营 · 重读本科</small></div>
  <div class="nmchip" style="left:540px;top:818px">你<small>正在探索的岔路口</small></div>

  <div class="tblock">
    <span class="kk">万花筒社区</span>
    <h1>链接走过<span class="c">相似路</span>的<br><span class="t">前辈与同行者</span></h1>
    <p>当你站在选择面前，总有人走过相似的岔路口。真实经验、专业咨询与互助支持，让你不再独自面对迷茫。</p>
  </div>

  <div class="cards">
    <div class="fcard"><svg class="ic" viewBox="-40 -40 80 80" id="i1"></svg><h3>真实经验</h3><p>相关但结局不同的真实故事，帮你校准对未来的判断。</p></div>
    <div class="fcard"><svg class="ic" viewBox="-40 -40 80 80" id="i2"></svg><h3>专业咨询</h3><p>需要更深入时，链接可信赖的顾问，获得专业视角。</p></div>
    <div class="fcard"><svg class="ic" viewBox="-40 -40 80 80" id="i3"></svg><h3>互助支持</h3><p>走同一段路的人彼此陪伴，让选择的时刻不再孤单。</p></div>
  </div>
  <div class="resbar"><div><b>＝ 不再独自迷茫</b> &nbsp;<span>万花筒，抽一位走过相似路的旅人</span></div><div class="go">进入社区 →</div></div>
</div>
<script src="flat.js"></script>
<script>
  const svg=document.getElementById('scene');FLAT.defs(svg);const {E,C}=FLAT;
  svg.appendChild(FLAT.rays(540,420,1100,28,[C.cream2,"#FBE9B8"]));
  // 中心花
  svg.appendChild(FLAT.flower(540,410,128,C.coral,C.mustard,C.tealD));
  // 连线：中心到旅人
  const me=[540,720];[[190,700],[360,650],[720,650],[895,700]].forEach(p=>{
    svg.appendChild(E("path",{d:`M${me[0]},${me[1]} L${p[0]},${p[1]}`,stroke:C.ink,"stroke-width":4,"stroke-dasharray":"3 16","stroke-linecap":"round",opacity:.28}));});
  // 落地阴影 + 旅人们
  const ppl=[[190,760,1.15,C.sky],[360,712,1.3,C.mustard],[720,712,1.3,C.mint],[895,760,1.15,C.coral]];
  ppl.forEach(p=>svg.appendChild(E("ellipse",{cx:p[0],cy:p[1]+4,rx:34*p[2],ry:9,fill:C.tealD,opacity:.14})));
  svg.appendChild(E("ellipse",{cx:540,cy:776,rx:56,ry:12,fill:C.tealD,opacity:.16}));
  ppl.forEach(p=>svg.appendChild(FLAT.person(p[0],p[1],p[2],{shirt:p[3],pants:C.skyD,shoe:C.coralD})));
  // 中心“你”（大一点，珊瑚衣）
  svg.appendChild(FLAT.person(540,772,1.6,{shirt:C.coral,pants:C.skyD,shoe:C.mustard}));
  FLAT.defs(document.getElementById('bmk'));document.getElementById('bmk').appendChild(FLAT.flower(0,0,36,C.coral,C.teal,C.mustard));
  ["i1","i2","i3"].forEach((id,k)=>{const s=document.getElementById(id);FLAT.defs(s);s.appendChild(FLAT.icon(["chat","cap","heart"][k]));});
</script>
<div class="grain"></div><div class="grain2"></div>
</body></html>
