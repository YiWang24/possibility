name: Possibility
options:
  bundleIdPrefix: com.possibility
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 985WPAR345
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  # 埋点 Layer 2：PostHog（客户端行为 / 漏斗 / 留存看板）
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.68.3
  # 埋点 Layer 3：Sentry（崩溃 + 事件面包屑，崩前行为可回放）
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.23.0
targets:
  Possibility:
    type: application
    platform: iOS
    sources:
      - path: Possibility/App
      - path: Possibility/Core
      - path: Possibility/Features
      - path: Possibility/Resources/Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
      - package: PostHog
        product: PostHog
      - package: Sentry
        product: Sentry
    # Base.xcconfig 已入库，内部 #include? 本地 Config.xcconfig（含密钥，不入库）。
    # 走 configFiles 而非手工在 Xcode 里点选，xcodegen 重生成工程后不会丢。
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    entitlements:
      path: Possibility/Possibility.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Possibility/Resources/Info.plist
      properties:
        CFBundleDisplayName: Possibility
        # 版本号交给构建设置，CI/脚本可用 xcodebuild 覆盖 CURRENT_PROJECT_VERSION 递增构建号
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 未使用非豁免加密（仅 HTTPS）。不声明的话每次上传 TestFlight 都会卡在人工填写出口合规
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        # 埋点密钥同样走 Config.xcconfig 注入，不进仓库（见 Config.xcconfig.example）。
        # 留空时对应 backend 自动不注册，App 正常运行 —— 埋点缺失不能拖垮主流程。
        POSTHOG_API_KEY: "$(POSTHOG_API_KEY)"
        POSTHOG_HOST: "$(POSTHOG_HOST)"
        SENTRY_DSN: "$(SENTRY_DSN)"
        NSMicrophoneUsageDescription: 录制语音日记需要使用麦克风。
        NSSpeechRecognitionUsageDescription: 将语音日记转写为文字需要使用语音识别。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.possibility.possibility
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # 归档也用开发身份签名，分发签名由 -exportArchive 统一换。这不是将就，是 Xcode
      # Organizer「Distribute App」的原生流程：命令行 archive 的自动签名只会解析*开发*
      # 描述文件（试过钉 Apple Distribution，会和自动签名冲突而失败）。
      # 关键是**不能**把归档做成不签名/ad-hoc —— 那样 Xcode 会跳过「嵌入框架并重签」，
      # 预编译的 Sentry.xcframework 桩二进制会带着 linker-signed 的 ad-hoc 签名进包，
      # 事后补签只覆盖到原 codeLimit（49KB 的二进制只哈希 2 页），上传必被 ASC 拒
      # （90035 Invalid Signature，指向 Sentry.framework/Sentry）。
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Development
  PossibilityUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PossibilityUITests
    dependencies:
      - target: Possibility
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.possibility.possibility.uitests
        TEST_TARGET_NAME: Possibility
        GENERATE_INFOPLIST_FILE: YES
  PossibilityTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PossibilityTests
    dependencies:
      - target: Possibility
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.possibility.possibility.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Possibility:
    build:
      targets:
        Possibility: all
        PossibilityUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PossibilityTests
        - PossibilityUITests
