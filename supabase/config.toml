# Possibility · Supabase 本地/项目配置
project_id = "adx"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
# 验证邮件里的链接跳回站点根路径（web 用 window.location.origin 现算），
# 该列表是 Supabase 的 redirect allow list，不在表里的地址会被打回 site_url。
# 线上域名与预览域名需在 Dashboard → Auth → URL Configuration 里同步添加。
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000"]
# 匿名登录已停用：改为冷启动登录墙（邮箱 + 密码），无会话不放行任何页面。
# 全部 Edge Functions 经 requireUser() 强制校验 JWT，匿名浏览本就会大面积 401。
enable_anonymous_sign_ins = false
# 手动 identity linking 只为「匿名转正」服务，随匿名一并停用
enable_manual_linking = false
minimum_password_length = 6

# ---- 邮箱 + 密码登录（当前唯一的自有账号体系） ----
# enable_confirmations = false：signUp 直接返回 session，注册即登录，不拦在验证前。
#
# 产品要的是「验证链接照发、但不阻断登录」，而 Supabase 并没有这个组合开关：
# 确认开着就必然不返回 session（signIn 报 email_not_confirmed），关着则一封不发。
# 所以确认保持关闭，验证信改由客户端在注册成功后补发一次 signInWithOtp
# （见 web/stores/auth.ts sendVerificationEmail 与 iOS SupabaseService）。
# 代价：Supabase 侧 email_confirmed_at 在注册时即置位，不能用它判断用户是否真点了
# 链接；日后若要「已验证」这一状态，需要业务表自己记，别指望这个字段。
[auth.email]
enable_signup = true
enable_confirmations = false

# 补发的验证信走 magic_link 模板（signInWithOtp 用的就是它）——默认文案是「登录链接」，
# 与注册后「验证你的邮箱」的语境不符，这里改写。
# 注意：本段只对本地 supabase start 生效，线上模板在 Dashboard → Auth → Email Templates。
[auth.email.template.magic_link]
subject = "验证你的 Possibility 邮箱"
content_path = "./supabase/templates/verify_email.html"

# ---- 发信通道：Zoho Mail（加拿大区）----
# 默认 enabled = false：本地开发照旧走内置 Mailpit（信落在 http://127.0.0.1:54324，
# 不会真发出去），谁都不需要 Zoho 凭据，CI 也不受影响。只有要验真实投递时才：
#   SUPABASE_AUTH_SMTP_PASS=<Zoho 应用专用密码> supabase start
# 并把下面的 enabled 临时改成 true。
#
# host 必须是 smtp.zohocloud.ca —— yilab.tech 的 MX 指向 mx.zohocloud.ca、SPF 是
# include:zohocloud.ca，账号在 Zoho 加拿大数据中心。发往 smtp.zoho.com（美国区）
# 连得上、但一律 535 Authentication Failed，现象极像「密码填错了」，别再踩。
# 465(SSL) 与 587(STARTTLS) 实测均可用，取 465，少一轮 STARTTLS 协商。
#
# 密码只走 env()，仓库里不留明文（.gitignore 的 .env* 已挡下 supabase/.env）。
#
# ⚠️ 线上不读本段，也不要用 `supabase config push` 推它 —— 那会把整个 auth 段
# 一起推上去，包括下面 site_url = "http://localhost:3000"，线上跳转当场就断。
# Hosted 项目的 Auth SMTP 是项目级配置，也不归 scripts/doppler-sync.sh 管
# （那个同步的是 Edge Functions Secrets，两码事），
# 需在 Dashboard → Project Settings → Authentication → SMTP Settings 手工配同一份。
[auth.email.smtp]
enabled = false
host = "smtp.zohocloud.ca"
port = 465
user = "yiwang@yilab.tech"
pass = "env(SUPABASE_AUTH_SMTP_PASS)"
admin_email = "yiwang@yilab.tech"
sender_name = "我有可能 Possibility"

# ---- 手机验证码登录（已停用，配置保留便于日后恢复） ----
# 恢复步骤：取消下面三段注释 + 线上 Dashboard 开启 Phone provider 与 Send SMS hook。
# 服务端代码（send-sms-hook 函数、阿里云短信模块）未删除，仍在仓库里。
#
# [auth.sms]
# enable_signup = true
# enable_confirmations = true
#
# 本地开发固定测试号码 + 验证码（不触发真实短信，也不经过 hook）
# [auth.sms.test_otp]
# 8613800000000 = "123456"
#
# 自定义短信发送：Auth 生成 OTP 后回调 send-sms-hook（阿里云 Dysmsapi）。
# secret 仅本地开发用（与 functions serve 的 SEND_SMS_HOOK_SECRET 保持一致）；
# 线上在 Dashboard → Auth → Hooks 配置并用生成的 secret。
# [auth.hook.send_sms]
# enabled = true
# uri = "http://host.docker.internal:54321/functions/v1/send-sms-hook"
# secrets = "v1,whsec_bG9jYWwtZGV2LXNlbmQtc21zLWhvb2stc2VjcmV0"

# ---- Apple 登录（iOS 原生 signInWithIdToken，无需 secret）----
# 线上在 Dashboard 配置 Apple provider，Client IDs 填 App Bundle ID。
[auth.external.apple]
enabled = true
client_id = "com.johnnywang.possibility"
secret = ""

