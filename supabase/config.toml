# Possibility · Supabase 本地/项目配置
project_id = "adx"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
# 匿名登录已停用：改为冷启动登录墙（邮箱 + 密码），无会话不放行任何页面。
# 全部 Edge Functions 经 requireUser() 强制校验 JWT，匿名浏览本就会大面积 401。
enable_anonymous_sign_ins = false
# 手动 identity linking 只为「匿名转正」服务，随匿名一并停用
enable_manual_linking = false
minimum_password_length = 6

# ---- 邮箱 + 密码登录（当前唯一的自有账号体系） ----
# enable_confirmations = false：signUp 直接返回 session，注册即登录，不走确认邮件。
# 需要邮箱验证时改 true，并同步处理 signUp 返回 session == nil 的分支。
[auth.email]
enable_signup = true
enable_confirmations = false

# ---- 手机验证码登录（已停用，配置保留便于日后恢复） ----
# 恢复步骤：取消下面三段注释 + 线上 Dashboard 开启 Phone provider 与 Send SMS hook。
# 服务端代码（send-sms-hook 函数、阿里云短信模块）未删除，仍在仓库里。
#
# [auth.sms]
# enable_signup = true
# enable_confirmations = true
#
# 本地开发固定测试号码 + 验证码（不触发真实短信，也不经过 hook）
# [auth.sms.test_otp]
# 8613800000000 = "123456"
#
# 自定义短信发送：Auth 生成 OTP 后回调 send-sms-hook（阿里云 Dysmsapi）。
# secret 仅本地开发用（与 functions serve 的 SEND_SMS_HOOK_SECRET 保持一致）；
# 线上在 Dashboard → Auth → Hooks 配置并用生成的 secret。
# [auth.hook.send_sms]
# enabled = true
# uri = "http://host.docker.internal:54321/functions/v1/send-sms-hook"
# secrets = "v1,whsec_bG9jYWwtZGV2LXNlbmQtc21zLWhvb2stc2VjcmV0"

# ---- Apple 登录（iOS 原生 signInWithIdToken，无需 secret）----
# 线上在 Dashboard 配置 Apple provider，Client IDs 填 App Bundle ID。
[auth.external.apple]
enabled = true
client_id = "com.johnnywang.possibility"
secret = ""

[storage]
enabled = true

# ---- Edge Functions：全部强制校验 JWT ----
[functions.chat]
verify_jwt = true

[functions.match]
verify_jwt = true

[functions.simulate]
verify_jwt = true

[functions.analyze-diary]
verify_jwt = true

[functions.save-profile]
verify_jwt = true

[functions.get-profile]
verify_jwt = true

[functions.profile-privacy]
verify_jwt = true

[functions.list-conversations]
verify_jwt = true

[functions.list-diary]
verify_jwt = true

[functions.diary-summary]
verify_jwt = true

[functions.community]
verify_jwt = true

[functions.lab-choices]
verify_jwt = true

[functions.persona]
verify_jwt = true

# 以下两个函数当前休眠（手机验证码 + 匿名合并已停用），代码与部署配置保留待恢复。
# Auth Send SMS Hook：无用户 JWT，用 standardwebhooks secret 校验
[functions.send-sms-hook]
verify_jwt = false

[functions.merge-anonymous]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
