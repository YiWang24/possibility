name: Web

on:
  pull_request:
    paths:
      - 'web/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web.yml'
  workflow_dispatch:

jobs:
  web-check:
    name: 类型 / 设计 token 护栏 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm --filter @possibility/web run typecheck

      # 设计 token 护栏：裸 hex / 任意字号 / 任意圆角 / 任意阴影
      # 按文件 ratchet —— 存量只许减少，新增代码必须走 token。
      - name: 设计 token 护栏
        run: pnpm --filter @possibility/web run lint:tokens

      - name: 构建
        run: pnpm --filter @possibility/web run build
