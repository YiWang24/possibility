name: CI

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  backend-check:
    name: Deno 格式 / lint / 类型 / 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: fmt / lint / check / test
        run: npm run backend:check

  db-test:
    name: 迁移 + RLS 验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 启动本地数据库
        run: supabase db start

      - name: 应用全部 migration + seed
        run: supabase db reset

      - name: RLS / 数据隔离测试
        run: |
          PGPASSWORD=postgres psql \
            -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/tests/rls_test.sql

      # 安全 advisor 门禁：只对 ERROR 失败，WARN 仅打印。
      # 靠 schema 即可判定（RLS 未开、public 下的 security definer 等），跑本地实例即可，
      # 无需 SUPABASE_ACCESS_TOKEN / link。价值是拦住迁移「新引入」的高危项，
      # 而不是被存量 WARN 卡住合并。
      - name: 安全体检（Advisors）
        run: supabase db advisors --local --type security --level warn --fail-on error

