name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 避免并发部署互相覆盖；同一时间只跑一个生产部署。
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: db push + functions deploy
    runs-on: ubuntu-latest

    # 唯一的 GitHub secret：Doppler 服务令牌（scoped 到 possibility/prd）。
    # 其余凭据（SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD / SUPABASE_PROJECT_REF /
    # DEEPSEEK_*）全部由 doppler run 注入。
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: dopplerhq/cli-action@v3

      - name: 关联生产项目
        run: doppler run --command 'supabase link --project-ref "$SUPABASE_PROJECT_REF"'

      - name: 推送数据库迁移
        # Parallel PRs can merge migrations whose timestamps precede the
        # latest version already applied remotely. Include every migration
        # missing from remote history instead of rejecting that valid order.
        run: doppler run --command 'supabase db push --include-all'

      # 错误上报（docs/engineering/埋点方案.md Layer 3）的 SENTRY_DSN / SENTRY_ENVIRONMENT 也走这条通道：
      # doppler-sync.sh 只排除 DOPPLER_/SUPABASE_ 前缀，其余键全量同步，无需在此逐个列举。
      # Doppler 未配 SENTRY_DSN 时 _shared/sentry.ts 静默关闭上报——功能不可用，但绝不阻断部署。
      - name: 同步 Edge Function 密钥（Doppler → Supabase）
        run: doppler run --command 'bash scripts/doppler-sync.sh prd "$SUPABASE_PROJECT_REF"'

      - name: 部署 Edge Functions
        run: doppler run --command 'supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"'
