name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 避免并发部署互相覆盖；同一时间只跑一个生产部署。
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: db push + functions deploy
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 关联生产项目
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: 推送数据库迁移
        run: supabase db push

      - name: 同步 Edge Function 密钥
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_CHAT_MODEL: ${{ vars.DEEPSEEK_CHAT_MODEL }}
          DEEPSEEK_STRUCTURED_MODEL: ${{ vars.DEEPSEEK_STRUCTURED_MODEL }}
          DEEPSEEK_DIARY_MODEL: ${{ vars.DEEPSEEK_DIARY_MODEL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
        run: |
          umask 077
          {
            printf 'DEEPSEEK_API_KEY=%s\n' "$DEEPSEEK_API_KEY"
            printf 'DEEPSEEK_BASE_URL=%s\n' "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
            printf 'DEEPSEEK_CHAT_MODEL=%s\n' "${DEEPSEEK_CHAT_MODEL:-deepseek-v4-flash}"
            printf 'DEEPSEEK_STRUCTURED_MODEL=%s\n' "${DEEPSEEK_STRUCTURED_MODEL:-deepseek-v4-pro}"
            printf 'DEEPSEEK_DIARY_MODEL=%s\n' "${DEEPSEEK_DIARY_MODEL:-deepseek-v4-pro}"
            # 错误上报（docs/埋点方案.md Layer 3）。未在仓库配置 SENTRY_DSN 时写入空值，
            # _shared/sentry.ts 会静默关闭上报——功能不可用，但绝不阻断部署。
            printf 'SENTRY_DSN=%s\n' "${SENTRY_DSN:-}"
            printf 'SENTRY_ENVIRONMENT=%s\n' "${SENTRY_ENVIRONMENT:-production}"
          } > supabase/.env.ci
          supabase secrets set --env-file supabase/.env.ci --project-ref "$SUPABASE_PROJECT_ID"
          rm -f supabase/.env.ci

      - name: 部署 Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
